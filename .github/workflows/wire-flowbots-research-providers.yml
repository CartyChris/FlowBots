name: Wire FlowBots research providers

on:
  push:
    branches: [feature/rakazo-local-ai-os]
    paths:
      - ".github/workflows/wire-flowbots-research-providers.yml"
      - "scripts/wire-flowbots-research-providers.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wire-flowbots-research-providers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/rakazo-local-ai-os
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded provider wiring
        run: node scripts/wire-flowbots-research-providers.mjs
      - name: Verify intended files changed
        run: |
          set -euo pipefail
          git diff --exit-code -- scripts/wire-flowbots-research-providers.mjs .github/workflows/wire-flowbots-research-providers.yml
          git diff --check
          git diff -- packages/adapters/src/pi-runtime.ts packages/adapters/src/executor.ts
          test -n "$(git status --short packages/adapters/src/pi-runtime.ts packages/adapters/src/executor.ts)"
      - name: Commit wiring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/adapters/src/pi-runtime.ts packages/adapters/src/executor.ts
          git commit -m "feat(adapters): wire Venice and G0DM0D3 research routes"
          git push origin HEAD:feature/rakazo-local-ai-os
