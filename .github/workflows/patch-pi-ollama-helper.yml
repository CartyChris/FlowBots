name: patch-pi-ollama-helper
on:
  push:
    branches: [feature/rakazo-local-ai-os]
    paths: [.github/workflows/patch-pi-ollama-helper.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feature/rakazo-local-ai-os
      - name: Patch typed Ollama stream helper only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/adapters/src/pi-runtime.ts')
          s = p.read_text()
          replacements = [
            (
              'import { OLLAMA_PROVIDER_ID, ollamaBaseUrl, ollamaProvider } from "./ollama-provider.js";',
              'import { OLLAMA_PROVIDER_ID, ollamaStreamSimple } from "./ollama-provider.js";'
            ),
            (
              'const catalogModels = builtinModels();\nconst ollama = ollamaProvider(ollamaBaseUrl());\nconst MAX_PARALLEL_SUBAGENTS = 4;',
              'const catalogModels = builtinModels();\nconst MAX_PARALLEL_SUBAGENTS = 4;'
            ),
            (
              '  return model.provider === OLLAMA_PROVIDER_ID\n    ? ollama.api.streamSimple(model as never, context, options)\n    : models.streamSimple(model, context, options);',
              '  return model.provider === OLLAMA_PROVIDER_ID\n    ? ollamaStreamSimple(model as never, context, options)\n    : models.streamSimple(model, context, options);'
            ),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:100]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit production fix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/adapters/src/pi-runtime.ts
          git commit -m "fix(adapters): use typed Ollama stream helper"
          git push origin HEAD:feature/rakazo-local-ai-os
