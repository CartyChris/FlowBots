name: Apply FlowBots public branding

on:
  push:
    branches: [docs/flowbots-branding]
    paths:
      - .github/workflows/apply-flowbots-branding.yml

permissions:
  contents: write

jobs:
  update-branding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/flowbots-branding
          fetch-depth: 0
      - name: Update README and package descriptions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text()
          old_intro = '''# Rakazo

![Rakazo — AI teammates you actually own](./docs/readme-hero.png)

Open-source Grok Bot alternative, built with Cursor and Grok 4.6.

Web, desktop, and mobile. Bring your own AI and sandbox. The product is still early (beta).
'''
          new_intro = '''# FlowBots

> **FlowBots is a modified and customized version of [Rakazo](https://github.com/elie222/rakazo), created by [Elie Steinbock (@elie222)](https://github.com/elie222). Huge thanks to Elie and the Rakazo contributors for open-sourcing the original project and giving this fork such a strong foundation.**

![Rakazo upstream — AI teammates you actually own](./docs/readme-hero.png)

**FlowBots** is a local-first, open-source Grok Bots-style agent workspace built on Rakazo, expanded with per-bot computers, local AI/model support, bounded bot-to-bot collaboration and reactions, optional Mnemosyne recall, and a self-contained macOS Lite runtime.

**No account sign-up is required for the recommended FlowBots Lite desktop mode.** Lite automatically creates and signs into a local-only workspace identity on your Mac. You only connect or select the AI model(s) you want to use.

Web, desktop, and mobile are still supported. Bring your own AI and sandbox. This fork remains early/beta software.
'''
          if old_intro not in text:
              raise SystemExit("README intro anchor not found")
          text = text.replace(old_intro, new_intro, 1)

          old_run = '''Open [http://127.0.0.1:5173](http://127.0.0.1:5173). Sign up, pick a model from the Pi catalog (paste an API key, sign in with ChatGPT / Copilot / SuperGrok, or Skip if the deployment key is set), create a bot, send a message. The computer pane is a live Linux desktop.'''
          new_run = '''Open [http://127.0.0.1:5173](http://127.0.0.1:5173). The full web/server mode retains Rakazo's normal account authentication; for the no-sign-up local experience, use the packaged FlowBots desktop app in **Lite** mode, which provisions the local-only workspace identity automatically. In web/server mode, sign up, pick a model from the Pi catalog (paste an API key, sign in with ChatGPT / Copilot / SuperGrok, or Skip if the deployment key is set), create a bot, and send a message. The computer pane is a live Linux desktop.'''
          if old_run not in text:
              raise SystemExit("README web-run anchor not found")
          text = text.replace(old_run, new_run, 1)

          marker = '''\n---\n\n[Inbox Zero Inc.]'''
          credits = '''
## Credits and upstream

FlowBots is an independently modified/customized fork of [Rakazo](https://github.com/elie222/rakazo) by [Elie Steinbock (@elie222)](https://github.com/elie222). **Thank you to Elie and all upstream Rakazo contributors** for releasing the original project as open source and making this work possible.

FlowBots preserves the upstream Apache-2.0 license and intentionally keeps some internal `@rakazo/*` package names for compatibility, while the end-user desktop product and this customized fork are branded **FlowBots**.
'''
          if marker not in text:
              raise SystemExit("README credits anchor not found")
          text = text.replace(marker, "\n" + credits + marker, 1)
          readme.write_text(text)

          root = Path("package.json")
          root_text = root.read_text()
          root_anchor = '  "name": "rakazo",\n  "private": true,'
          root_replacement = '  "name": "rakazo",\n  "description": "FlowBots — a customized local-first fork of Rakazo with no account sign-up required in Lite desktop mode.",\n  "private": true,'
          if root_anchor not in root_text:
              raise SystemExit("root package.json anchor not found")
          root.write_text(root_text.replace(root_anchor, root_replacement, 1))

          desktop = Path("apps/desktop/package.json")
          desktop_text = desktop.read_text()
          desktop_anchor = '  "version": "0.1.0",\n  "license": "Apache-2.0",'
          desktop_replacement = '  "version": "0.1.0",\n  "description": "FlowBots desktop — a customized local-first Rakazo fork with automatic local workspace setup in Lite mode.",\n  "license": "Apache-2.0",'
          if desktop_anchor not in desktop_text:
              raise SystemExit("desktop package.json anchor not found")
          desktop.write_text(desktop_text.replace(desktop_anchor, desktop_replacement, 1))
          PY
      - name: Verify branding changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^# FlowBots$' README.md
          grep -q 'No account sign-up is required for the recommended FlowBots Lite desktop mode' README.md
          grep -q 'Elie Steinbock (@elie222)' README.md
          grep -q 'FlowBots — a customized local-first fork of Rakazo' package.json
          grep -q 'FlowBots desktop — a customized local-first Rakazo fork' apps/desktop/package.json
          git diff --check
      - name: Commit branding and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-flowbots-branding.yml
          git add -- README.md package.json apps/desktop/package.json
          git commit -m "docs: brand customized Rakazo fork as FlowBots"
          git push origin HEAD:docs/flowbots-branding
