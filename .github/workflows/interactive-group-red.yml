name: Interactive Group RED
on:
  push:
    branches: [feature/interactive-group-chats]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Confirm group routing contract is RED
        shell: bash
        run: |
          set +e
          pnpm exec vitest run packages/core/src/group-chat-routing.test.ts
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "Expected group routing test to fail before implementation" >&2
            exit 1
          fi
          echo "GROUP_ROUTING_RED_CONFIRMED=1"
      - name: Install Chromium
        run: pnpm --filter @rakazo/web exec playwright install --with-deps chromium
      - name: Confirm sticky-selection regression is RED
        shell: bash
        run: |
          set +e
          pnpm test:e2e -- --grep "non-first bot selection survives"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "Expected sticky selection test to fail before implementation" >&2
            exit 1
          fi
          echo "BOT_SELECTION_RED_CONFIRMED=1"
