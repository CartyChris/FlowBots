name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - run: pnpm check

  build:
    name: Production builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
          BETTER_AUTH_SECRET: ci-build-auth-secret-at-least-32-characters
          ENCRYPTION_KEY: ci-build-encryption-key-at-least-32-characters
      - name: Electron smoke
        run: xvfb-run --auto-servernum pnpm --filter @rakazo/desktop exec playwright test --config e2e/playwright.config.ts

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - run: pnpm test

  test-integration:
    name: Postgres journeys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  test-e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @rakazo/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  apply-task4b:
    name: Apply Task 4B GREEN
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feature/flowbots-local-social-vnext'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/flowbots-local-social-vnext
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply stored verified migration
        shell: bash
        run: |
          if [ ! -f .github/workflows/task4b-harness-center-green.yml ]; then
            echo "Task 4B migration already applied"
            exit 0
          fi
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/task4b-harness-center-green.yml').read_text()
          start = "          python3 <<'PY'\n"
          end = "\n          PY\n"
          body = source.split(start, 1)[1].split(end, 1)[0]
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          Path('/tmp/task4b-green.py').write_text(body + "\n")
          PY
          python3 /tmp/task4b-green.py
          python3 <<'PY'
          from pathlib import Path

          router = Path('apps/api/src/router.ts')
          text = router.read_text()
          old = 'const probe = probes.get(definition.id) ?? { available: false as const };'
          new = 'const probe = probes.get(definition.id) ?? { available: false as const, version: undefined, detail: undefined };'
          if text.count(old) != 1:
              raise SystemExit(f'router probe line count was {text.count(old)}')
          router.write_text(text.replace(old, new, 1))

          runtime = Path('apps/local-runtime/src/index.ts')
          text = runtime.read_text()
          old = 'if (!server || !server.listening) return Promise.resolve();'
          new = 'if (!server?.listening) return Promise.resolve();'
          if text.count(old) != 1:
              raise SystemExit(f'local runtime optional-chain line count was {text.count(old)}')
          runtime.write_text(text.replace(old, new, 1))
          Path('docs/superpowers/.task4b-trigger').unlink(missing_ok=True)
          PY
      - name: Format and verify migrated tree
        run: |
          pnpm exec biome check --write apps/api/src/env.ts apps/api/src/env.test.ts apps/api/src/app.ts apps/api/src/router.ts apps/local-runtime/src/index.ts packages/testkit/src/cli/harness.ts packages/contracts/src/rpc.ts apps/web/src/pages/Shell.tsx apps/web/src/pages/HarnessesOverlay.tsx
          pnpm db:generate
          pnpm check
          pnpm exec vitest run apps/api/src/env.test.ts packages/adapters/src/cli-agent.test.ts packages/adapters/src/cli-agent-invocation.test.ts
          git diff --check
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(local): wire secure Harness Center [task4b-green]"
          git push origin HEAD:feature/flowbots-local-social-vnext

  deploy-production:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: [lint, check, build, test, test-integration, test-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://app.rakazo.com
    steps:
      - name: Configure production SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/rakazo-production"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rakazo-production" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/rakazo-production" >/dev/null

      - name: Deploy successful main revision
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          ssh -F /dev/null \
            -i "$HOME/.ssh/rakazo-production" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" deploy-main
