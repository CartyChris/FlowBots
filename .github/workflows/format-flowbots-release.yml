name: Format FlowBots release

on:
  push:
    branches: [release/flowbots-macos-providers]
    paths:
      - ".github/workflows/format-flowbots-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/flowbots-macos-providers
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply safe Biome fixes
        run: pnpm exec biome check --write . || true
      - name: Verify safe diff
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test -n "$(git status --short)"
      - name: Commit safe formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply safe Biome fixes"
          git push origin HEAD:release/flowbots-macos-providers
