name: Update FlowBots Prisma lockfile

on:
  push:
    branches: [release/flowbots-macos-providers]
    paths:
      - ".github/workflows/update-flowbots-prisma-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/flowbots-macos-providers
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify focused lockfile change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- pnpm-lock.yaml
          test -n "$(git status --short pnpm-lock.yaml)"
          test "$(git status --short | grep -v '^ M pnpm-lock.yaml$' | wc -l | tr -d ' ')" -eq 0
          grep -A16 '^  apps/desktop:' pnpm-lock.yaml | grep "'@prisma/client':"
      - run: pnpm install --frozen-lockfile
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync desktop Prisma lockfile"
          git push origin HEAD:release/flowbots-macos-providers
