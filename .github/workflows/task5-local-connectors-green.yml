name: task5-local-connectors-green
on:
  push:
    branches: [feature/flowbots-local-social-vnext]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[task5-green]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/flowbots-local-social-vnext
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch router connector configuration boundaries
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/router.ts')
          text = p.read_text()

          if 'from "./local-connectors.js"' not in text:
              anchor = 'import { addScreenProxyCapability } from "./screen-proxy.js";'
              insert = 'import {\n  clearPersistedComposioKey,\n  hasPersistedComposioKey,\n  savePersistedComposioKey,\n} from "./local-connectors.js";\n' + anchor
              if anchor not in text: raise SystemExit('missing local connector import anchor')
              text = text.replace(anchor, insert, 1)

          if 'composioApiKey?: string;' not in text:
              anchor = '    openRouterKey?: string;\n'
              if anchor not in text: raise SystemExit('missing RouterDeps key anchor')
              text = text.replace(anchor, anchor + '    composioApiKey?: string;\n', 1)

          if 'composioStatus: authed.connections.composioStatus' not in text:
              anchor = '    connections: {\n'
              block = '''    connections: {
      composioStatus: authed.connections.composioStatus.handler(async ({ context }) => {
        const local = await hasPersistedComposioKey(deps.prisma, context.actor);
        return {
          configured: local || Boolean(deps.env.composioApiKey),
          source: local
            ? ("local" as const)
            : deps.env.composioApiKey
              ? ("environment" as const)
              : ("none" as const),
        };
      }),
      configureComposio: authed.connections.configureComposio.handler(async ({ context, input }) => {
        assertHostHarnessAccess(deps, context.actor);
        await savePersistedComposioKey(deps.prisma, deps.secrets, context.actor, input.apiKey);
        deps.composio?.setApiKey(input.apiKey);
        return { configured: true as const };
      }),
      clearComposio: authed.connections.clearComposio.handler(async ({ context }) => {
        assertHostHarnessAccess(deps, context.actor);
        await clearPersistedComposioKey(deps.prisma, context.actor);
        deps.composio?.setApiKey(deps.env.composioApiKey);
        return { ok: true as const };
      }),
'''
              if anchor not in text: raise SystemExit('missing connections block anchor')
              text = text.replace(anchor, block, 1)

          text = text.replace('if (!deps.composio) return [];', 'if (!deps.composio?.configured()) return [];')
          if 'Configure Composio before connecting apps.' not in text:
              anchor = '      begin: authed.connections.begin.handler(async ({ context, input }) => {\n'
              guard = anchor + '        if (!deps.composio?.configured()) {\n          throw new ORPCError("BAD_REQUEST", { message: "Configure Composio before connecting apps." });\n        }\n'
              if anchor not in text: raise SystemExit('missing connections.begin anchor')
              text = text.replace(anchor, guard, 1)
          text = text.replace('''        if (!deps.composio) {
          return { connectionId: row.id, authorizationUrl: null };
        }
        try {''', '        try {')
          text = text.replace('if (deps.composio) {\n          const ready = await deps.composio.connectionReady(', 'if (deps.composio?.configured()) {\n          const ready = await deps.composio.connectionReady(')
          text = text.replace('if (row && deps.composio) {\n          await deps.composio.revoke(', 'if (row && deps.composio?.configured()) {\n          await deps.composio.revoke(')

          required = [
              'clearPersistedComposioKey',
              'composioApiKey?: string;',
              'composioStatus: authed.connections.composioStatus',
              'configureComposio: authed.connections.configureComposio',
              'clearComposio: authed.connections.clearComposio',
              'if (!deps.composio?.configured()) return [];',
              'Configure Composio before connecting apps.',
          ]
          missing = [item for item in required if item not in text]
          if missing: raise SystemExit(f'missing Task 5 router postconditions: {missing}')
          p.write_text(text)
          Path('.github/workflows/task5-local-connectors-green.yml').unlink()
          Path('docs/superpowers/.task5-trigger').unlink(missing_ok=True)
          PY
      - name: Format and verify
        run: |
          pnpm exec biome check --write apps/api/src/router.ts apps/api/src/app.ts apps/api/src/local-connectors.ts packages/contracts/src/rpc.ts packages/adapters/src/mcp-client.ts packages/adapters/src/mcp-connector.ts packages/adapters/src/composio-connector.ts packages/adapters/src/composio-local.test.ts packages/adapters/src/mcp-connector.test.ts apps/web/src/pages/PluginsOverlay.tsx apps/web/src/pages/McpOverlay.tsx
          pnpm db:generate
          pnpm check
          pnpm exec vitest run packages/adapters/src/composio-local.test.ts packages/adapters/src/mcp-connector.test.ts packages/adapters/src/cli-agent.test.ts
          git diff --check
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Commit verified Task 5 backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(local): persist Composio and expose MCP tools [task5-green]"
          git push origin HEAD:feature/flowbots-local-social-vnext
