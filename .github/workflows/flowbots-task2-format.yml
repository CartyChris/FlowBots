name: FlowBots Task 2 formatter

on:
  push:
    branches: [feature/flowbots-local-social-vnext]
    paths:
      - "apps/local-runtime/src/index.ts"
      - "apps/local-runtime/src/runtime.test.ts"
      - "apps/desktop/src/runtime-session.ts"
      - "apps/desktop/src/runtime-session.test.ts"
      - ".github/workflows/flowbots-task2-format.yml"

permissions:
  contents: write

concurrency:
  group: flowbots-task2-format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/flowbots-local-social-vnext
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Task 2 files only
        run: >-
          pnpm exec biome check --write
          apps/local-runtime/src/index.ts
          apps/local-runtime/src/runtime.test.ts
          apps/desktop/src/runtime-session.ts
          apps/desktop/src/runtime-session.test.ts
      - name: Commit formatter output if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Task 2 files already formatted."
            exit 0
          fi
          git config user.name "FlowBots CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/local-runtime/src/index.ts \
            apps/local-runtime/src/runtime.test.ts \
            apps/desktop/src/runtime-session.ts \
            apps/desktop/src/runtime-session.test.ts
          git commit -m "style: format FlowBots local bootstrap"
          git push origin HEAD:feature/flowbots-local-social-vnext
