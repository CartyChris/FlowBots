name: macOS package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify recovered agent work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm verify:fast

  package-macos:
    name: Build universal macOS DMG
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build universal DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter @rakazo/desktop pack:mac
      - name: Verify DMG output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/out/*.dmg)
          if (( ${#dmgs[@]} == 0 )); then
            echo "No DMG was produced in apps/desktop/out" >&2
            exit 1
          fi
          printf 'Produced DMG(s):\n'
          ls -lh "${dmgs[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: Rakazo-macOS-universal-${{ github.sha }}
          path: apps/desktop/out/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
