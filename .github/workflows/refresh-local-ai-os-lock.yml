name: refresh-local-ai-os-lock
on:
  push:
    branches: [feature/rakazo-local-ai-os]
    paths:
      - "apps/local-runtime/package.json"
      - "apps/api/package.json"
      - "apps/desktop/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/refresh-local-ai-os-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-local-ai-os-lock
  cancel-in-progress: true

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/rakazo-local-ai-os
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit refreshed lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh Local AI OS lockfile"
          git push origin HEAD:feature/rakazo-local-ai-os
