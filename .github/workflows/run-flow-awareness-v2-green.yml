name: Flow Awareness V2 GREEN Precise

on:
  push:
    branches: [feature/flow-awareness-research-v2]
    paths:
      - ".github/scripts/run-flow-awareness-v2-green.mjs"
      - ".github/workflows/run-flow-awareness-v2-green.yml"

permissions:
  contents: write

concurrency:
  group: flow-awareness-v2-green-precise
  cancel-in-progress: true

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/flow-awareness-research-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/rakazo
      - name: Apply precise guarded production transformation
        run: node .github/scripts/run-flow-awareness-v2-green.mjs
      - name: Format changed source and tests
        run: |
          pnpm exec biome check --write \
            packages/core/src/flow-awareness.ts \
            packages/adapters/src/builtin-tools.ts \
            packages/adapters/src/peer-connector.ts \
            packages/adapters/src/executor.ts \
            packages/adapters/src/research-verification.ts \
            packages/adapters/src/flow-awareness.test.ts \
            packages/adapters/src/research-verification.test.ts \
            packages/adapters/src/peer-flow-isolation.test.ts \
            packages/ui-web/src/bot-avatar.tsx \
            packages/ui-web/src/bot-work-state.ts \
            packages/ui-web/src/bot-work-state.test.ts \
            packages/ui-web/src/styles.css \
            apps/web/src/pages/Shell.tsx \
            apps/web/src/pages/SteeringStudio.tsx \
            apps/web/src/pages/CreativeRuntimeHost.tsx \
            apps/web/e2e/creative-runtime.spec.ts
      - name: Focused adapter contracts
        run: pnpm --filter @rakazo/adapters test -- flow-awareness.test.ts research-verification.test.ts peer-flow-isolation.test.ts peer-connector.test.ts agent-evolution-integration.test.ts
      - name: Focused UI contracts
        run: pnpm --filter @rakazo/ui-web test -- bot-work-state.test.ts
      - name: Full unit suite
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm check
      - name: Diff integrity
        run: git diff --check
      - name: Commit verified GREEN transformation
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test ! -e .github/scripts/flow-awareness-v2-green.mjs
          test ! -e .github/workflows/flow-awareness-v2-green.yml
          test ! -e .github/scripts/run-flow-awareness-v2-green.mjs
          test ! -e .github/workflows/run-flow-awareness-v2-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit" >&2
            exit 1
          fi
          git commit -m "feat: connect FlowBots and verify current claims"
          git push origin HEAD:feature/flow-awareness-research-v2
