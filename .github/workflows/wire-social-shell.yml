name: wire-social-shell
on:
  push:
    branches: [feature/flowbots-local-social-vnext]
    paths: [.github/workflows/wire-social-shell.yml]
permissions:
  contents: write
concurrency:
  group: wire-social-shell
  cancel-in-progress: false
jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'ci: wire social shell once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse stale branch state
        run: |
          git fetch origin feature/flowbots-local-social-vnext
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/feature/flowbots-local-social-vnext)" = "$GITHUB_SHA"
      - name: Wire social shell surfaces
        run: |
          python3 <<'PY'
          from pathlib import Path

          shell_path = Path('apps/web/src/pages/Shell.tsx')
          text = shell_path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one exact anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''import {
            abortableDelay,
            cronFromPreset,
            defaultCronPreset,
            formatCron,
            presetFromCron,
          } from "@rakazo/core";
          import { BotAvatar, Button } from "@rakazo/ui-web";'''.replace('          ', ''),
          '''import {
            abortableDelay,
            applyBotRoleInstructions,
            BOT_ROLE_PRESETS,
            botRoleSelection,
            cronFromPreset,
            defaultCronPreset,
            formatCron,
            presetFromCron,
            type BotRolePreset,
          } from "@rakazo/core";
          import {
            BOT_AVATAR_FACE_CHOICES,
            BotAvatar,
            type BotAvatarState,
            Button,
          } from "@rakazo/ui-web";'''.replace('          ', ''),
          'core/ui imports')

          replace_once(
          'import { HarnessesOverlay } from "./HarnessesOverlay";\n',
          'import { ComposerActions } from "./ComposerActions";\nimport { HarnessesOverlay } from "./HarnessesOverlay";\n',
          'composer import')
          replace_once(
          'import { HostComputerPrompt } from "./HostComputerPrompt";\n',
          'import { HostComputerPrompt } from "./HostComputerPrompt";\nimport { MessageReactions } from "./MessageReactions";\n',
          'reaction import')

          replace_once(
          '''  const embeddedScreenUrl = embeddableScreenUrl(screenUrl);

          const userName = session.data?.user.name ?? "You";'''.replace('          ', ''),
          '''  const embeddedScreenUrl = embeddableScreenUrl(screenUrl);

          async function addWebFilesToDraft(files: FileList) {
            const contexts = await Promise.all(
              Array.from(files)
                .slice(0, 6)
                .map(async (file) => {
                  const textLike =
                    file.type.startsWith("text/") ||
                    /\\.(md|txt|json|ya?ml|toml|csv|ts|tsx|js|jsx|py|rs|go|java|c|cpp|h|html|css)$/i.test(
                      file.name,
                    );
                  if (!textLike) return `File: ${file.name} (${file.size} bytes; binary)`;
                  const body = (await file.text()).slice(0, 50_000);
                  return `File: ${file.name}\\n${body}`;
                }),
            );
            setDraft((current) => [current.trim(), ...contexts].filter(Boolean).join("\\n\\n"));
          }

          const userName = session.data?.user.name ?? "You";'''.replace('          ', ''),
          'web file helper')

          replace_once(
          '<BotAvatar color={bot.color} size={38} />',
          '<BotAvatar color={bot.color} size={38} state={avatarStateFor(bot.status)} label={bot.name} />',
          'sidebar avatar')
          replace_once(
          '<BotAvatar color={active.color} size={26} />',
          '<BotAvatar color={active.color} size={26} state={avatarStateFor(snapshot?.run?.status ?? active.status)} label={active.name} />',
          'header avatar')
          replace_once(
          '<BotAvatar color={active.color} size={28} />',
          '<BotAvatar color={active.color} size={28} state={avatarStateFor(snapshot?.run?.status ?? active.status)} label={active.name} />',
          'computer avatar')

          replace_once(
          '''            <span className="grid h-[34px] w-[34px] shrink-0 place-items-center rounded-full border border-[#26262A] text-[18px] text-[#9A9AA0]">
              +
            </span>
            <input''',
          '''            <ComposerActions
              onSelectedPaths={({ kind, paths }) => {
                const label = kind === "workspace" ? "Workspace" : "Files";
                const context = `${label}: ${paths.map((item) => `${item.name} (${item.path})`).join(", ")}`;
                setDraft((current) => [current.trim(), context].filter(Boolean).join("\\n\\n"));
              }}
              onWebFiles={(files) => void addWebFilesToDraft(files)}
              onComputer={() => setPanel("computer")}
              onConnections={() => setPluginsOpen(true)}
              onHarnesses={() => setHarnessesOpen(true)}
              onTeammate={() =>
                setDraft((current) =>
                  [current.trim(), "Ask a teammate bot to "].filter(Boolean).join("\\n\\n"),
                )
              }
            />
            <input''',
          'composer actions')

          replace_once(
          '''        return null;
              })}
            </>
          );
        }

        function CreateBotForm'''.replace('        ', ''),
          '''        return null;
              })}
              {message.role === "bot" ? <MessageReactions messageId={message.id} /> : null}
            </>
          );
        }

        function CreateBotForm'''.replace('        ', ''),
          'message reactions')

          replace_once(
          '''  onSave: (patch: {
            name?: string;
            title?: string;
            description?: string;
            instructions?: string;
          }) => Promise<void>;'''.replace('          ', ''),
          '''  onSave: (patch: {
            name?: string;
            title?: string;
            description?: string;
            instructions?: string;
            color?: string;
          }) => Promise<void>;'''.replace('          ', ''),
          'settings save type')

          replace_once(
          '''  const [name, setName] = useState(bot.name);
          const [title, setTitle] = useState(bot.title);
          const [description, setDescription] = useState(bot.description);
          const [confirming, setConfirming] = useState(false);'''.replace('          ', ''),
          '''  const [name, setName] = useState(bot.name);
          const [title, setTitle] = useState(bot.title);
          const [description, setDescription] = useState(bot.description);
          const storedRole = botRoleSelection(bot.instructions);
          const [role, setRole] = useState<BotRolePreset>(storedRole.role ?? "Employee");
          const [roleContext, setRoleContext] = useState(storedRole.context);
          const [color, setColor] = useState(bot.color);
          const [confirming, setConfirming] = useState(false);'''.replace('          ', ''),
          'settings state')

          replace_once(
          '''      <div className="flex justify-center">
            <BotAvatar color={bot.color} size={64} />
          </div>
          <label className="mt-6 block text-[14px] text-[#85858A]">'''.replace('          ', ''),
          '''      <div className="flex justify-center">
            <BotAvatar color={color} size={64} state="happy" label={bot.name} />
          </div>
          <div className="mt-5">
            <div className="mb-2 text-[14px] text-[#85858A]">Face</div>
            <div className="grid grid-cols-5 gap-2">
              {BOT_AVATAR_FACE_CHOICES.map((choice) => (
                <button
                  key={choice.variant}
                  type="button"
                  aria-label={`Use ${choice.label} face`}
                  aria-pressed={color === choice.color}
                  onClick={() => setColor(choice.color)}
                  className={`grid place-items-center rounded-[12px] border py-2 ${
                    color === choice.color ? "border-[#A8A8AD] bg-[#1D1D20]" : "border-[#26262A]"
                  }`}
                >
                  <BotAvatar
                    color={choice.color}
                    variant={choice.variant}
                    state="happy"
                    size={36}
                  />
                </button>
              ))}
            </div>
          </div>
          <label className="mt-5 block text-[14px] text-[#85858A]">
            Bot role
            <select
              value={role}
              onChange={(event) => setRole(event.target.value as BotRolePreset)}
              className="mt-2 w-full rounded-[11px] border border-[#26262A] bg-[#111113] px-3.5 py-3 text-[#ECECEE]"
            >
              {(Object.keys(BOT_ROLE_PRESETS) as BotRolePreset[]).map((option) => (
                <option key={option} value={option}>
                  {option}
                </option>
              ))}
            </select>
          </label>
          <label className="mt-4 block text-[14px] text-[#85858A]">
            Role context
            <textarea
              value={roleContext}
              onChange={(event) => setRoleContext(event.target.value)}
              placeholder={role === "Custom" ? "Describe this bot's personality and working style" : "Optional extra guidance for this role"}
              rows={3}
              className="mt-2 w-full rounded-[11px] border border-[#26262A] bg-transparent px-3.5 py-3 text-[#ECECEE]"
            />
          </label>
          <label className="mt-6 block text-[14px] text-[#85858A]">'''.replace('          ', ''),
          'settings role/face controls')

          replace_once(
          'onClick={() => void onSave({ name, title, description, instructions: description })}',
          'aria-label="Save bot settings"\n          onClick={() =>\n            void onSave({\n              name,\n              title,\n              description,\n              color,\n              instructions: applyBotRoleInstructions(bot.instructions, role, roleContext),\n            })\n          }',
          'settings save')

          replace_once(
          '''function applyThreadEvent(
          event: ProductEvent,'''.replace('          ', ''),
          '''function avatarStateFor(status: string | undefined): BotAvatarState {
            const normalized = status?.toLowerCase();
            if (normalized === "running" || normalized === "working") return "working";
            if (normalized === "queued" || normalized === "leased" || normalized === "booting") {
              return "thinking";
            }
            if (normalized === "failed" || normalized === "error") return "error";
            if (normalized === "completed") return "happy";
            return "idle";
          }

          function applyThreadEvent(
          event: ProductEvent,'''.replace('          ', ''),
          'avatar state helper')

          shell_path.write_text(text)

          golden = Path('apps/web/e2e/golden.spec.ts')
          g = golden.read_text()
          anchor = 'test("sign-in, spawn, and stop work in the shell", async ({ page }) => {'
          if g.count(anchor) != 1:
              raise SystemExit(f'golden social anchor count={g.count(anchor)}')
          social = r'''test("roles, faces, composer actions, and reactions work in the shell", async ({ page }) => {
            const stamp = Date.now();
            await signup(page, `social-${stamp}@rakazo.test`, "password12", "Social");
            await completeOnboarding(page, ["A bit of everything", "Clear and tight"]);

            await page.getByText("Chief").first().click();
            const gear = page.locator("button:has-text('⚙')");
            if (!(await gear.isVisible().catch(() => false))) {
              await page.getByTitle("Agent computer").click();
            }
            await gear.click();
            await page.getByLabel("Bot role").selectOption("Developer");
            await page.getByRole("button", { name: "Use Cat face" }).click();
            await page.getByRole("button", { name: "Save bot settings" }).click();
            await expect(page.getByLabel("Bot role")).toHaveValue("Developer");
            await expect(page.getByRole("button", { name: "Use Cat face" })).toHaveAttribute(
              "aria-pressed",
              "true",
            );

            const composer = page.getByPlaceholder(/Message/);
            await page.getByRole("button", { name: "Add" }).click();
            await expect(page.getByRole("menu", { name: "Add context" })).toBeVisible();
            await page.getByRole("menuitem", { name: "Ask a teammate" }).click();
            await expect(composer).toHaveValue(/Ask a teammate bot to/);

            await composer.fill("Reply with hello in one short sentence.");
            await page.keyboard.press("Enter");
            const fire = page.getByRole("button", { name: "React 🔥" }).last();
            await expect(fire).toBeVisible({ timeout: 30_000 });
            await fire.click();
            await expect(fire).toHaveAttribute("aria-pressed", "true");
          });

          '''.replace('          ', '')
          golden.write_text(g.replace(anchor, social + anchor, 1))

          Path('.github/workflows/wire-social-shell.yml').unlink()
          PY
      - name: Format and verify integrated social slice
        run: |
          pnpm exec biome check --write apps/web/src/pages/Shell.tsx apps/web/e2e/golden.spec.ts packages/core/src/bot-personality.ts packages/core/src/bot-personality.test.ts apps/web/src/pages/ComposerActions.tsx apps/web/src/pages/MessageReactions.tsx packages/ui-web/src/bot-avatar.tsx
          pnpm db:generate
          pnpm check
          pnpm exec vitest run packages/core/src/bot-personality.test.ts packages/ui-web/src/bot-avatar.test.ts packages/adapters/src/reaction-store.test.ts packages/adapters/src/peer-connector.test.ts apps/web/src/lib/docker-setup.test.ts
          git diff --check
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Commit only on the original head
        run: |
          git fetch origin feature/flowbots-local-social-vnext
          test "$(git rev-parse origin/feature/flowbots-local-social-vnext)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(web): wire social roles faces reactions and composer"
          git fetch origin feature/flowbots-local-social-vnext
          test "$(git rev-parse origin/feature/flowbots-local-social-vnext)" = "$GITHUB_SHA"
          git push origin HEAD:feature/flowbots-local-social-vnext
