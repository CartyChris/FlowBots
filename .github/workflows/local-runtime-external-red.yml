name: LocalRuntime external dependency RED

on:
  push:
    branches: [fix/local-runtime-external-deps]
    paths:
      - ".github/workflows/local-runtime-external-red.yml"
      - "apps/desktop/src/local-runtime-dependencies.test.ts"
      - "apps/desktop/package.json"
      - "apps/desktop/scripts/build-local-runtime.mjs"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rakazo/desktop test -- local-runtime-dependencies.test.ts
