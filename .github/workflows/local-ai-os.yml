name: local-ai-os
on:
  push:
    branches: [main, feature/rakazo-local-ai-os]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-ai-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned Mnemosyne
        run: python -m pip install --disable-pip-version-check "mnemosyne-memory==3.15.1"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - run: pnpm --filter @rakazo/db test
      - run: pnpm --filter @rakazo/api test -- env.test.ts
      - run: pnpm --filter @rakazo/core test -- ai-os-kernel.test.ts
      - run: pnpm --filter @rakazo/core check
      - run: pnpm --filter @rakazo/adapters test -- ai-os-bridges.test.ts
      - run: pnpm --filter @rakazo/adapters check
      - run: pnpm --filter @rakazo/memory test -- brain-folders.test.ts
      - name: Real Mnemosyne memory integration
        run: pnpm --filter @rakazo/memory test -- mnemosyne.integration.test.ts
        env:
          RAKAZO_TEST_MNEMOSYNE: "1"
      - run: pnpm --filter @rakazo/local-runtime test
      - run: pnpm --filter @rakazo/desktop test -- runtime-profile.test.ts
      - run: pnpm --filter @rakazo/desktop check