name: update-local-ai-os-lock

on:
  push:
    branches:
      - feature/rakazo-local-ai-os
    paths:
      - .github/workflows/update-local-ai-os-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feature/rakazo-local-ai-os
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile only
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh Local AI OS lockfile"
          git push origin HEAD:feature/rakazo-local-ai-os
