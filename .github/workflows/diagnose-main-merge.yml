name: Diagnose main merge conflicts

on:
  push:
    branches: [feature/rakazo-local-ai-os]
    paths:
      - ".github/workflows/diagnose-main-merge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reproduce merge and report exact conflicts
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          status=$?
          echo "MERGE_EXIT=$status"
          echo "=== unresolved paths ==="
          git diff --name-only --diff-filter=U
          echo "=== conflict hunks ==="
          git diff --cc --no-ext-diff --no-color
          echo "=== status ==="
          git status --short
          if [ "$status" -eq 0 ]; then
            git merge --abort || true
            exit 0
          fi
          count="$(git diff --name-only --diff-filter=U | wc -l | tr -d ' ')"
          git merge --abort || true
          if [ "$count" -eq 0 ]; then
            echo "Merge failed without unresolved paths" >&2
            exit 2
          fi
          exit 1