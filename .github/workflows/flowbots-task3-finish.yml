name: FlowBots Task 3 finish

on:
  push:
    branches: [feature/flowbots-local-social-vnext]
    paths:
      - ".github/workflows/flowbots-task3-finish.yml"

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/flowbots-local-social-vnext
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire API and onboarding to refreshable catalog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "apps/api/src/app.ts",
              "      openRouterKey: env.openRouterKey,\n      webOrigin:",
              "      openRouterKey: env.openRouterKey,\n      ollamaBaseUrl: env.ollamaBaseUrl,\n      webOrigin:",
          )

          replace_once(
              "apps/api/src/router.ts",
              "  listPiCatalog,\n  type PiOAuthLogins,",
              "  listPiCatalog,\n  type PiOAuthLogins,\n  resolveModelApiKey,",
          )
          replace_once(
              "apps/api/src/router.ts",
              "    openRouterKey?: string;\n    webOrigin: string;",
              "    openRouterKey?: string;\n    ollamaBaseUrl: string;\n    webOrigin: string;",
          )
          replace_once(
              "apps/api/src/router.ts",
              "      list: authed.models.list.handler(async () => [...listPiCatalog(), scriptedCatalogEntry]),",
              '''      list: authed.models.list.handler(async ({ context }) => {
        const xaiCredential = await deps.prisma.userModelCredential.findFirst({
          where: {
            userId: context.actor.userId,
            workspaceId: context.actor.workspaceId,
            provider: "xai",
          },
          orderBy: [{ isDefault: "desc" }, { updatedAt: "desc" }],
        });
        let xaiApiKey: string | undefined;
        if (xaiCredential) {
          const secret = await deps.prisma.secret.findFirst({
            where: {
              id: xaiCredential.secretId,
              userId: context.actor.userId,
              workspaceId: context.actor.workspaceId,
            },
          });
          if (secret) {
            const plaintext = deps.secrets.load(secret.ciphertext);
            xaiApiKey = await resolveModelApiKey(plaintext, "xai", {
              persist: async (next) => {
                const encrypted = await deps.secrets.put(next, {
                  operationId: `models:list:${context.actor.userId}`,
                  traceId: `models:list:${context.actor.userId}`,
                  workspaceId: context.actor.workspaceId,
                  userId: context.actor.userId,
                  signal: new AbortController().signal,
                });
                await deps.prisma.secret.update({
                  where: { id: secret.id },
                  data: { ciphertext: encrypted.ciphertext },
                });
              },
            }).catch(() => undefined);
          }
        }
        return listPiCatalog({
          refresh: true,
          staticCatalog: [...listPiCatalog(), scriptedCatalogEntry],
          ollamaBaseUrl: deps.env.ollamaBaseUrl,
          xaiApiKey,
        });
      }),''',
          )

          replace_once(
              "apps/web/src/pages/Onboarding.tsx",
              "  const [catalog, setCatalog] = useState<CatalogEntry[]>([]);\n  const [query, setQuery] = useState(\"\");",
              "  const [catalog, setCatalog] = useState<CatalogEntry[]>([]);\n  const [refreshingModels, setRefreshingModels] = useState(false);\n  const [query, setQuery] = useState(\"\");",
          )
          replace_once(
              "apps/web/src/pages/Onboarding.tsx",
              "  const signInLabel = selected?.oauthLabel ?? \"Sign in\";\n\n  async function saveModel() {",
              '''  const signInLabel = selected?.oauthLabel ?? "Sign in";

  async function refreshModels() {
    setRefreshingModels(true);
    setError(null);
    try {
      const models = await rpc.models.list();
      setCatalog(models);
      if (!models.some((entry) => entry.provider === provider && entry.id === modelId)) {
        const first = models.find((entry) => entry.provider === provider);
        if (first) setModelId(first.id);
      }
    } catch (err) {
      setError(err instanceof Error ? err.message : "Could not refresh models");
    } finally {
      setRefreshingModels(false);
    }
  }

  async function saveModel() {''',
          )
          replace_once(
              "apps/web/src/pages/Onboarding.tsx",
              "              Rakazo does not pay for model usage. Paste an API key, sign in with ChatGPT, Copilot,\n              or SuperGrok, or skip if this deployment already has a key.",
              "              FlowBots uses your own local models, API keys, or existing provider sign-ins. Refresh anytime to discover newly installed Ollama models or models newly available to your provider account.",
          )
          replace_once(
              "apps/web/src/pages/Onboarding.tsx",
              '''            <input
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Search providers and models"
              className="mt-8 w-full rounded-[11px] border border-[#26262A] bg-transparent px-3.5 py-3 text-[#ECECEE]"
            />''',
              '''            <div className="mt-8 flex gap-2">
              <input
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Search providers and models"
                className="min-w-0 flex-1 rounded-[11px] border border-[#26262A] bg-transparent px-3.5 py-3 text-[#ECECEE]"
              />
              <button
                type="button"
                onClick={() => void refreshModels()}
                disabled={refreshingModels}
                className="rounded-[11px] border border-[#343438] px-3.5 text-sm text-[#D8D8DB] hover:bg-[#19191C] disabled:opacity-40"
              >
                {refreshingModels ? "Refreshing…" : "Refresh models"}
              </button>
            </div>''',
          )
          replace_once(
              "apps/web/src/pages/Onboarding.tsx",
              '''            <p className="mt-2 text-[13px] text-[#85858A]">{selected?.billing}</p>''',
              '''            <p className="mt-2 text-[13px] text-[#85858A]">{selected?.billing}</p>
            <label className="mt-4 block text-sm text-[#85858A]">
              Model ID override
              <input
                value={modelId}
                onChange={(e) => setModelId(e.target.value)}
                placeholder="Type any provider-supported model ID"
                className="mt-2 w-full rounded-[11px] border border-[#26262A] bg-transparent px-3.5 py-3 font-mono text-[13px] text-[#ECECEE]"
              />
              <span className="mt-1.5 block text-[12px] text-[#66666C]">
                Useful for preview/new models before a catalog catches up.
              </span>
            </label>''',
          )
          PY

          pnpm exec biome check --write \
            apps/api/src/app.ts \
            apps/api/src/router.ts \
            apps/web/src/pages/Onboarding.tsx \
            apps/api/src/env.ts \
            packages/adapters/src/model-catalog.ts \
            packages/adapters/src/model-catalog.test.ts \
            packages/adapters/src/pi-models.ts

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FlowBots CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/api/src/app.ts \
            apps/api/src/router.ts \
            apps/web/src/pages/Onboarding.tsx \
            apps/api/src/env.ts \
            packages/adapters/src/model-catalog.ts \
            packages/adapters/src/model-catalog.test.ts \
            packages/adapters/src/pi-models.ts
          if git diff --cached --quiet; then
            echo "No Task 3 changes required."
            exit 0
          fi
          git commit -m "feat: finish live model discovery and refresh UI"
          git push origin HEAD:feature/flowbots-local-social-vnext
