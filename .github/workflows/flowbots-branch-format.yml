name: FlowBots branch formatter

on:
  push:
    branches: [feature/flowbots-local-social-vnext]
    paths:
      - "packages/adapters/src/web-fetch.ts"
      - "packages/adapters/src/web-fetch.test.ts"
      - "packages/adapters/src/destination-emulator.ts"
      - "packages/adapters/src/destination-web.test.ts"
      - ".github/workflows/flowbots-branch-format.yml"

permissions:
  contents: write

concurrency:
  group: flowbots-branch-format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/flowbots-local-social-vnext
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Task 1 files only
        run: >-
          pnpm exec biome check --write
          packages/adapters/src/web-fetch.ts
          packages/adapters/src/web-fetch.test.ts
          packages/adapters/src/destination-emulator.ts
          packages/adapters/src/destination-web.test.ts
      - name: Commit formatter output if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Task 1 files already formatted."
            exit 0
          fi
          git config user.name "FlowBots CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            packages/adapters/src/web-fetch.ts \
            packages/adapters/src/web-fetch.test.ts \
            packages/adapters/src/destination-emulator.ts \
            packages/adapters/src/destination-web.test.ts
          git commit -m "style(adapters): format web fetch implementation"
          git push origin HEAD:feature/flowbots-local-social-vnext
