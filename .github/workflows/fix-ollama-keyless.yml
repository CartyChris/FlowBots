name: Ollama keyless GREEN

on:
  push:
    branches:
      - feature/flowbots-local-social-vnext
    paths:
      - scripts/fix-ollama-keyless.py
      - .github/workflows/fix-ollama-keyless.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ollama-keyless-green
  cancel-in-progress: false

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact GREEN transformation
        run: python3 scripts/fix-ollama-keyless.py
      - name: Format transformed sources
        run: pnpm exec biome check --write apps/api/src/router.ts apps/web/src/pages/ModelSettingsOverlay.tsx apps/api/src/local-model-default.test.ts
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/rakazo
      - name: Verify focused RED contract is GREEN
        run: pnpm exec vitest run apps/api/src/local-model-default.test.ts
      - name: Strict typecheck
        run: pnpm check
      - name: Lint transformed tree
        run: pnpm lint
      - name: Diff hygiene
        run: git diff --check
      - name: Commit cleaned GREEN tree only if head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/flowbots-local-social-vnext
          test "$(git rev-parse origin/feature/flowbots-local-social-vnext)" = "$GITHUB_SHA"
          git rm .github/workflows/fix-ollama-keyless.yml scripts/fix-ollama-keyless.py
          git add apps/api/src/router.ts apps/web/src/pages/ModelSettingsOverlay.tsx apps/api/src/local-model-default.test.ts docs/superpowers/reviews/2026-08-20-flowbots-fable-upstream-parity.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: distinguish Ollama preferences from secrets"
          git push origin HEAD:feature/flowbots-local-social-vnext
