name: wire-social-shell-retry
on:
  push:
    branches: [feature/flowbots-local-social-vnext]
    paths: [.github/workflows/wire-social-shell-retry.yml]
permissions:
  contents: write
concurrency:
  group: wire-social-shell-retry
  cancel-in-progress: false
jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'ci: retry social shell wiring safely' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse stale branch state
        run: |
          git fetch origin feature/flowbots-local-social-vnext
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/feature/flowbots-local-social-vnext)" = "$GITHUB_SHA"
      - name: Reuse reviewed social Shell migration
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/wire-social-shell.yml').read_text()
          marker = "python3 <<'PY'\n"
          if marker not in source:
              raise SystemExit('original migration script marker missing')
          body = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          lines = []
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/wire-social-shell.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/wire-social-shell.py
          rm -f .github/workflows/wire-social-shell-retry.yml
      - name: Format and verify integrated social slice
        run: |
          pnpm exec biome check --write apps/web/src/pages/Shell.tsx apps/web/e2e/golden.spec.ts packages/core/src/bot-personality.ts packages/core/src/bot-personality.test.ts apps/web/src/pages/ComposerActions.tsx apps/web/src/pages/MessageReactions.tsx packages/ui-web/src/bot-avatar.tsx packages/ui-web/src/styles.css apps/desktop/src/main.ts
          pnpm db:generate
          pnpm check
          pnpm exec vitest run packages/core/src/bot-personality.test.ts packages/ui-web/src/bot-avatar.test.ts packages/adapters/src/reaction-store.test.ts packages/adapters/src/peer-connector.test.ts apps/web/src/lib/docker-setup.test.ts
          git diff --check
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Commit only on the original head
        run: |
          git fetch origin feature/flowbots-local-social-vnext
          test "$(git rev-parse origin/feature/flowbots-local-social-vnext)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(web): wire social roles faces reactions and composer"
          git fetch origin feature/flowbots-local-social-vnext
          test "$(git rev-parse origin/feature/flowbots-local-social-vnext)" = "$GITHUB_SHA"
          git push origin HEAD:feature/flowbots-local-social-vnext
