name: FlowBots macOS package

on:
  push:
    branches: [feature/rakazo-local-ai-os]
    paths:
      - ".github/workflows/package-flowbots-macos.yml"
      - "apps/desktop/**"
      - "apps/web/**"
      - "apps/local-runtime/**"
      - "packages/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowbots-macos-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/rakazo
      - run: pnpm --filter @rakazo/desktop test
      - run: pnpm --filter @rakazo/desktop check
      - run: pnpm --filter @rakazo/local-runtime test

  package-macos:
    name: Build and inspect universal FlowBots DMG
    needs: verify
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/rakazo
      - name: Build universal FlowBots DMG
        run: CSC_IDENTITY_AUTO_DISCOVERY=false pnpm --filter @rakazo/desktop pack:mac
      - name: Inspect packaged FlowBots application
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/out/FlowBots-*-universal.dmg)
          test "${#dmgs[@]}" -eq 1
          dmg="${dmgs[0]}"
          mount_point="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_point" -quiet || true
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point" >/dev/null
          app="$mount_point/FlowBots.app"
          test -d "$app"
          test -d "$app/Contents/Resources/web"
          test -d "$app/Contents/Resources/migrations"
          test -d "$app/Contents/Resources/app.asar.unpacked/node_modules/node-pty"
          bundle_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")"
          test "$bundle_name" = "FlowBots"
          test -s "$dmg"
          shasum -a 256 "$dmg"
      - name: Upload FlowBots DMG
        uses: actions/upload-artifact@v4
        with:
          name: FlowBots-macOS-universal-${{ github.sha }}
          path: apps/desktop/out/FlowBots-*-universal.dmg
          if-no-files-found: error
          retention-days: 30
