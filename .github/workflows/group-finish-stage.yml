name: Group Finish Stage
on:
  push:
    branches: [feature/interactive-group-chats-finish]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply domain transform in runner
        run: node .github/scripts/group-domain-green.mjs
      - name: Apply runtime/API/UI transform in runner
        run: python3 .github/scripts/group-integration-green.py
      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Format staged files
        run: |
          pnpm exec biome check --write \
            packages/db/prisma/schema.prisma \
            packages/db/src/index.ts \
            packages/db/src/group-messages.ts \
            packages/db/src/group-runs.ts \
            packages/contracts/src/domain.ts \
            packages/contracts/src/rpc.ts \
            packages/core/src/group-chat-routing.ts \
            packages/core/src/group-chat-routing.test.ts \
            apps/api/src/router.ts \
            packages/adapters/src/executor.ts \
            apps/web/src/App.tsx \
            apps/web/src/pages/Shell.tsx \
            apps/web/src/pages/GroupChat.tsx \
            apps/web/src/pages/GroupChatEditor.tsx \
            apps/web/e2e/group-chat.spec.ts \
            apps/web/e2e/bot-selection.spec.ts
      - name: Routing unit contracts
        run: pnpm exec vitest run packages/core/src/group-chat-routing.test.ts
      - name: Typecheck
        run: pnpm check
      - name: Lint
        run: pnpm lint
      - name: Install Chromium
        run: pnpm --filter @rakazo/web exec playwright install --with-deps chromium
      - name: Selection and group E2E
        run: pnpm test:e2e -- --grep "non-first bot selection survives|group chat routes @all"
      - name: Diff integrity
        run: git diff --check
      - name: Bundle verified staged files
        run: |
          tar -czf /tmp/group-finish-staged.tar.gz \
            packages/db/prisma/schema.prisma \
            packages/db/src/index.ts \
            packages/db/src/group-messages.ts \
            packages/db/src/group-runs.ts \
            packages/contracts/src/domain.ts \
            packages/contracts/src/rpc.ts \
            packages/core/src/group-chat-routing.ts \
            packages/core/src/group-chat-routing.test.ts \
            apps/api/src/router.ts \
            packages/adapters/src/executor.ts \
            apps/web/src/App.tsx \
            apps/web/src/pages/Shell.tsx \
            apps/web/src/pages/GroupChat.tsx \
            apps/web/src/pages/GroupChatEditor.tsx \
            apps/web/e2e/group-chat.spec.ts \
            apps/web/e2e/bot-selection.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: group-finish-staged
          path: /tmp/group-finish-staged.tar.gz
          if-no-files-found: error
