name: Fix routine scheduling

on:
  push:
    branches: [feature/rakazo-local-ai-os]
    paths:
      - ".github/workflows/fix-routine-scheduling.yml"
      - "scripts/fix-routine-scheduling.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/rakazo-local-ai-os
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-routine-scheduling.mjs
      - name: Verify diff
        run: |
          set -euo pipefail
          git diff --check
          git diff -- packages/adapters/src/executor.ts
          test -n "$(git status --short packages/adapters/src/executor.ts)"
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/adapters/src/executor.ts
          git commit -m "fix(adapters): defer future routine wakeups"
          git push origin HEAD:feature/rakazo-local-ai-os
