name: Observe FlowBots main release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/observe-flowbots-main-release.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

env:
  TARGET_SHA: e681edf97433ebffedaefb3c447e3809f637f169
  REPORT_TITLE: FlowBots main release acceptance e681edf97433ebffedaefb3c447e3809f637f169
  GH_TOKEN: ${{ github.token }}

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Wait for exact merge workflows and report evidence
        shell: bash
        run: |
          set -euo pipefail
          required=("ci" "local-ai-os" "FlowBots macOS package")
          : > report.md
          found_all=false
          for attempt in $(seq 1 100); do
            runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f head_sha="$TARGET_SHA" -f per_page=100)"
            missing=0
            failed=0
            : > /tmp/rows
            for name in "${required[@]}"; do
              row="$(jq -c --arg name "$name" --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .name == $name)] | sort_by(.id) | last // empty' <<<"$runs")"
              if [[ -z "$row" ]]; then
                missing=$((missing + 1))
                continue
              fi
              status="$(jq -r '.status' <<<"$row")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$name" \
                "$(jq -r '.id' <<<"$row")" \
                "$(jq -r '.run_number' <<<"$row")" \
                "$status" \
                "$conclusion" \
                "$(jq -r '.html_url' <<<"$row")" >> /tmp/rows
              if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
                failed=1
              elif [[ "$status" != "completed" ]]; then
                missing=$((missing + 1))
              fi
            done
            if [[ "$failed" == 1 ]]; then
              break
            fi
            if [[ "$missing" == 0 ]]; then
              found_all=true
              break
            fi
            sleep 15
          done

          {
            echo "# FlowBots exact-main release acceptance"
            echo
            echo "Target merge SHA: \`$TARGET_SHA\`"
            echo
            echo "| Workflow | Run ID | Run # | Status | Conclusion | URL |"
            echo "| --- | ---: | ---: | --- | --- | --- |"
            while IFS=$'\t' read -r name id number status conclusion url; do
              echo "| $name | $id | $number | $status | ${conclusion:-pending} | $url |"
            done < /tmp/rows
          } > report.md

          if [[ "$found_all" != true ]]; then
            echo >> report.md
            echo "Acceptance did not reach three successful completed exact-SHA workflows." >> report.md
            gh issue create --title "$REPORT_TITLE" --body-file report.md
            exit 1
          fi

          package_id="$(awk -F'\t' '$1 == "FlowBots macOS package" {print $2}' /tmp/rows)"
          artifact_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$package_id/artifacts" -f per_page=100)"
          artifact_name="FlowBots-macOS-universal-$TARGET_SHA"
          artifact="$(jq -c --arg name "$artifact_name" '[.artifacts[] | select(.name == $name)] | last // empty' <<<"$artifact_json")"
          if [[ -z "$artifact" ]]; then
            echo >> report.md
            echo "Expected artifact \`$artifact_name\` was not present after successful package completion." >> report.md
            gh issue create --title "$REPORT_TITLE" --body-file report.md
            exit 1
          fi
          {
            echo
            echo "Artifact ID: $(jq -r '.id' <<<"$artifact")"
            echo "Artifact name: \`$(jq -r '.name' <<<"$artifact")\`"
            echo "Artifact expired: $(jq -r '.expired' <<<"$artifact")"
          } >> report.md
          gh issue create --title "$REPORT_TITLE" --body-file report.md

      - name: Remove temporary observer
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          if [[ -f .github/workflows/observe-flowbots-main-release.yml ]]; then
            git rm .github/workflows/observe-flowbots-main-release.yml
            git commit -m "chore: remove temporary FlowBots release observer"
            git push origin main
          fi
