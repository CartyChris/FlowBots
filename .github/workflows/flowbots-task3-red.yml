name: FlowBots Task 3 GREEN Gate

on:
  push:
    branches:
      - feature/flowbots-local-social-vnext
  pull_request:

permissions:
  contents: write

concurrency:
  group: flowbots-task3-green-gate
  cancel-in-progress: true

jobs:
  green:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'feature/flowbots-local-social-vnext'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/flowbots-local-social-vnext
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Task 3 wiring
        run: python scripts/flowbots-task3-green.py
      - name: Format touched files
        run: >-
          pnpm exec biome check --write
          apps/api/src/router.ts
          apps/web/src/pages/Onboarding.tsx
          apps/api/src/model-catalog-router.test.ts
          packages/contracts/src/rpc.ts
          packages/adapters/src/model-catalog.ts
          packages/adapters/src/model-catalog.test.ts
          packages/adapters/src/pi-models.ts
          packages/adapters/src/ollama-provider.ts
      - run: pnpm db:generate
      - name: Focused model discovery gate
        run: >-
          pnpm exec vitest run
          packages/adapters/src/model-catalog.test.ts
          apps/api/src/model-catalog-router.test.ts
          packages/adapters/src/ollama-provider.test.ts
      - name: Type boundaries
        run: |
          pnpm --filter @rakazo/contracts check
          pnpm --filter @rakazo/adapters check
          pnpm --filter @rakazo/api check
          pnpm --filter @rakazo/web check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified wiring when needed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Task 3 is already GREEN on the branch."
            exit 0
          fi
          git config user.name "FlowBots CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/api/src/router.ts \
            apps/web/src/pages/Onboarding.tsx \
            packages/contracts/src/rpc.ts \
            packages/adapters/src/ollama-provider.ts
          git commit -m "feat(models): wire live model refresh through API and onboarding"
          git pull --rebase origin feature/flowbots-local-social-vnext
          git push origin HEAD:feature/flowbots-local-social-vnext
