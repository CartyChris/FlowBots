name: FlowBots Task 3 RED

on:
  push:
    branches:
      - feature/flowbots-local-social-vnext

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check packages/adapters/src/model-catalog.test.ts packages/adapters/src/model-catalog.ts packages/adapters/src/pi-models.ts
      - run: pnpm --filter @rakazo/adapters check

  expected-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Expected behavioral RED
        run: pnpm exec vitest run packages/adapters/src/model-catalog.test.ts
