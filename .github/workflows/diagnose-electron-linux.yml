name: Diagnose Linux Electron startup

on:
  push:
    branches: [diag/electron-linux-startup]
    paths:
      - ".github/workflows/diagnose-electron-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/rakazo
      - run: pnpm --filter @rakazo/desktop build
      - name: Enumerate LocalRuntime bridge externals
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const source = readFileSync("apps/desktop/dist/local-runtime.js", "utf8");
          const specs = new Set();
          for (const match of source.matchAll(/\bfrom\s+["']([^"']+)["']/g)) specs.add(match[1]);
          for (const match of source.matchAll(/\bimport\(\s*["']([^"']+)["']\s*\)/g)) specs.add(match[1]);
          const bare = [...specs].filter((value) => !value.startsWith(".") && !value.startsWith("/")).sort();
          console.log("LocalRuntime external import specifiers:");
          for (const value of bare) console.log(value);
          NODE
      - name: Run Electron directly and capture main-process output
        shell: bash
        run: |
          set -uo pipefail
          logfile="$(mktemp)"
          set +e
          xvfb-run --auto-servernum timeout 8s pnpm --filter @rakazo/desktop exec electron --no-sandbox . >"$logfile" 2>&1
          status=$?
          set -e
          cat "$logfile"
          echo "electron_status=$status"
          rm -f "$logfile"
          if [ "$status" -eq 124 ]; then
            echo "Electron remained alive for the full diagnostic window."
            exit 0
          fi
          echo "Electron exited before the diagnostic timeout." >&2
          exit "$status"
