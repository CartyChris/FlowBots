name: Observe FlowBots release v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/observe-flowbots-release-v2.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  TARGET_SHA: e681edf97433ebffedaefb3c447e3809f637f169
  REPORT_PATH: docs/superpowers/reviews/2026-08-20-flowbots-main-release-acceptance.md
  GH_TOKEN: ${{ github.token }}

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Capture exact merge workflow evidence
        shell: bash
        run: |
          set -euo pipefail
          required=("ci" "local-ai-os" "FlowBots macOS package")
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f head_sha="$TARGET_SHA" -f per_page=100)"
          : > /tmp/rows
          all_success=true
          for name in "${required[@]}"; do
            row="$(jq -c --arg name "$name" --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .name == $name)] | sort_by(.id) | last // empty' <<<"$runs")"
            if [[ -z "$row" ]]; then
              printf '%s\tmissing\t\tmissing\tmissing\t\n' "$name" >> /tmp/rows
              all_success=false
              continue
            fi
            status="$(jq -r '.status' <<<"$row")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$name" "$(jq -r '.id' <<<"$row")" "$(jq -r '.run_number' <<<"$row")" "$status" "$conclusion" "$(jq -r '.html_url' <<<"$row")" >> /tmp/rows
            [[ "$status" == "completed" && "$conclusion" == "success" ]] || all_success=false
          done

          package_id="$(awk -F'\t' '$1 == "FlowBots macOS package" {print $2}' /tmp/rows)"
          artifact_id=""
          artifact_name=""
          artifact_digest=""
          artifact_expired=""
          if [[ "$package_id" != "missing" && -n "$package_id" ]]; then
            artifacts="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$package_id/artifacts" -f per_page=100)"
            wanted="FlowBots-macOS-universal-$TARGET_SHA"
            artifact="$(jq -c --arg name "$wanted" '[.artifacts[] | select(.name == $name)] | last // empty' <<<"$artifacts")"
            if [[ -n "$artifact" ]]; then
              artifact_id="$(jq -r '.id' <<<"$artifact")"
              artifact_name="$(jq -r '.name' <<<"$artifact")"
              artifact_digest="$(jq -r '.digest // ""' <<<"$artifact")"
              artifact_expired="$(jq -r '.expired' <<<"$artifact")"
            else
              all_success=false
            fi
          fi

          mkdir -p "$(dirname "$REPORT_PATH")"
          {
            echo "# FlowBots exact-main release acceptance"
            echo
            echo "Target product merge SHA: \`$TARGET_SHA\`"
            echo
            echo "| Workflow | Run ID | Run # | Status | Conclusion | URL |"
            echo "| --- | ---: | ---: | --- | --- | --- |"
            while IFS=$'\t' read -r name id number status conclusion url; do
              echo "| $name | $id | $number | $status | $conclusion | $url |"
            done < /tmp/rows
            echo
            echo "Artifact ID: $artifact_id"
            echo "Artifact name: \`$artifact_name\`"
            echo "Artifact API digest: \`$artifact_digest\`"
            echo "Artifact expired: $artifact_expired"
            echo
            echo "All exact-merge acceptance workflows successful: **$all_success**"
          } > "$REPORT_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git add "$REPORT_PATH"
          git rm .github/workflows/observe-flowbots-release-v2.yml
          git commit -m "docs: record exact FlowBots main release acceptance"
          git push origin main

          [[ "$all_success" == true ]]
