name: Apply release lint cleanup

on:
  push:
    branches: [release/flowbots-macos-providers]
    paths:
      - ".github/workflows/apply-release-lint-cleanup.yml"
      - "scripts/fix-release-lint.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/flowbots-macos-providers
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/rakazo
      - run: node scripts/fix-release-lint.mjs
      - name: Format touched files
        run: |
          pnpm exec biome format --write \
            apps/desktop/src/product-branding.test.ts \
            apps/local-runtime/src/index.ts \
            packages/adapters/src/mcp-client.ts \
            packages/adapters/src/openhands.test.ts \
            apps/desktop/src/preload.test.ts \
            apps/desktop/src/terminal-session.test.ts \
            packages/adapters/src/paperclip.test.ts \
            packages/adapters/src/prime-agent.test.ts \
            packages/adapters/src/prime-agent.ts
      - run: pnpm lint
      - run: pnpm --filter @rakazo/desktop test
      - run: pnpm --filter @rakazo/adapters test
      - run: pnpm --filter @rakazo/local-runtime test
      - run: pnpm check
      - name: Verify diff
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test -n "$(git status --short)"
      - name: Commit verified cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/product-branding.test.ts \
            apps/local-runtime/src/index.ts \
            packages/adapters/src/mcp-client.ts \
            packages/adapters/src/openhands.test.ts \
            apps/desktop/src/preload.test.ts \
            apps/desktop/src/terminal-session.test.ts \
            packages/adapters/src/paperclip.test.ts \
            packages/adapters/src/prime-agent.test.ts \
            packages/adapters/src/prime-agent.ts
          git commit -m "fix: clear release lint correctness findings"
          git push origin HEAD:release/flowbots-macos-providers
